<!-- PyScript Execution Area -->
<div id="news-output">Loading market news...</div>

<script type="py">
import json
from pyodide.http import pyfetch
from js import document

async def fetch_ticker_news(symbol="BTC"):
    # Bypassing yfinance: Fetch Yahoo Finance API via CORS proxy directly in PyScript
    target_url = f"https://query2.finance.yahoo.com/v1/finance/search?q={symbol}"
    proxy_url = f"https://api.allorigins.win/get?url={encodeURIComponent(target_url)}"

    try:
        response = await pyfetch(proxy_url)
        data = await response.json()
        
        # Parse nested proxy payload
        contents = json.loads(data.get("contents", "{}"))
        news_items = contents.get("news", [])

        if not news_items:
            return ["Warning: Received empty response from Yahoo Finance."]

        clean_headlines = []
        for item in news_items:
            title = item.get("title")
            publisher = item.get("publisher", "Unknown")
            url = item.get("link", "#")

            if title:
                clean_headlines.append(f"• [{publisher}] <a href='{url}' target='_blank'>{title}</a>")

        return clean_headlines

    except Exception as e:
        return [f"Error fetching news: {e}"]

# JavaScript helper function for URL encoding
from js import encodeURIComponent

async def main():
    headlines = await fetch_ticker_news("BTC")
    
    # Render results into the DOM
    output_html = "<h3>--- Market News ---</h3>" + "<br>".join(headlines[:8])
    document.getElementById("news-output").innerHTML = output_html

await main()
</script>
